# workers/wrangler-cron.toml
# 独立 Cron Worker 配置
# 部署命令：wrangler deploy --config workers/wrangler-cron.toml

name = "xin-yu-cron"
main = "cron-worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 2 * * *"]

# Workers AI binding — 用于 @cf/baai/bge-m3 向量嵌入（1024维）
[ai]
binding = "AI"

# 环境变量在 CF Dashboard 里配置（和 Pages 共用同一套值）
# GEMINI_API_KEY、SUPABASE_URL、SUPABASE_SERVICE_KEY
