# wrangler.toml - Cloudflare Workers configuration for KnowledgeOS (OpenNext build)
# Build with `npm run build:cf`, then deploy with `npm run deploy`.
# Set the Clerk secret once with: npx wrangler secret put CLERK_SECRET_KEY

name = "myai"
main = ".open-next/worker.js"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[dev]
port = 8788

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "VOICE_KV"
id = "b37aa1043f544632a002618ec4270bc2"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "knowledgeos-assets"

# D1 Database binding
[[d1_databases]]
binding = "myai"
database_name = "myai"
database_id = "76ba054d-2fcf-4f15-8248-804d916fc729"

# Public Clerk key only. The secret key is set with `wrangler secret put`.
[vars]
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_c21hc2hpbmctdGVycmFwaW4tMjgyOC5jbGVyay5hY2NvdW50cy5kZXYk"
