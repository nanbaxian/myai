# wrangler.toml - Cloudflare Pages configuration for KnowledgeOS
# Recreate the Pages project and bindings in the Cloudflare dashboard before deploying.
# Pages Functions do not support Cron Triggers, so the cron worker stays separate.

name = "myai"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

[dev]
port = 8788

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "VOICE_KV"
id = "b37aa1043f544632a002618ec4270bc2"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "knowledgeos-assets"

# D1 Database binding
# Create with: wrangler d1 create knowledgeos_db
# Apply schema: wrangler d1 execute knowledgeos_db --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "knowledgeos_db"
database_id = "b28a40c9-1df9-47bb-addd-8c9f805f5eed"

# Environment variables
[env.production]
vars = { NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_c21hc2hpbmctdGVycmFwaW4tMjgyOC5jbGVyay5hY2NvdW50cy5kZXYk", CLERK_SECRET_KEY = "sk_test_BgV2SN0eFuOgAeD7xi4Jw0ecQk2WCSOXWrdPR4Aq7U" }

[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "VOICE_KV"
id = "b37aa1043f544632a002618ec4270bc2"

[[env.production.r2_buckets]]
